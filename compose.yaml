# Usage: mkdir -p export sources && docker compose up --build   then open http://localhost:8000
#
# Libraries store absolute paths to tracks, so music and USB sticks are mounted
# at the same path inside the container as on your machine.
#
# Writable by default, because converting to a stick or syncing updates them in
# place (every file changed is backed up first): the Mixxx folder and USB sticks.
# Read-only by default: your music (set MUSIC_ACCESS=rw to write Serato cue tags
# into it) and Rekordbox's own library (it can only be read).
services:
  dj-library-converter:
    build: .
    image: dj-library-converter
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    # Write files as you, not root: `export UID GID=$(id -g)` if yours aren't 1000.
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      BROWSE_ROOTS: "/sources:/export:${MUSIC_DIR:-${HOME}/Music}:${USB_DIR:-/media}"
    volumes:
      # Drop a rekordbox.xml, a mixxxdb.sqlite or a _Serato_ folder in ./sources.
      - "./sources:/sources/files:ro"
      - "${MIXXX_DIR:-${HOME}/.mixxx}:/sources/mixxx"
      # Rekordbox 6/7's folder: ~/Library/Pioneer/rekordbox (macOS), %APPDATA%/Pioneer/rekordbox (Windows).
      - "${REKORDBOX_DIR:-./sources/rekordbox}:/sources/rekordbox:ro"
      - "${MUSIC_DIR:-${HOME}/Music}:${MUSIC_DIR:-${HOME}/Music}:${MUSIC_ACCESS:-ro}"
      # Where removable drives appear: /media (most Linux desktops), /run/media, /Volumes (macOS).
      # Sticks plugged in after startup need a restart, or USB_MOUNT_MODE=rw,rslave on Linux
      # hosts whose / is a shared mount (systemd's default).
      - "${USB_DIR:-/media}:${USB_DIR:-/media}:${USB_MOUNT_MODE:-rw}"
      - "${EXPORT_DIR:-./export}:/export"
    restart: unless-stopped
